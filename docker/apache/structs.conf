<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    # IBC and factory denominations contain slashes. Keep them encoded during
    # filesystem/rewrite processing; Symfony validates the decoded parameter.
    # This directive must be on the virtual host, not only the main server, and
    # is not inherited: any TLS virtual host (for example default-ssl on 443)
    # needs the same line or encoded denominations 404 there.
    AllowEncodedSlashes NoDecode

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
